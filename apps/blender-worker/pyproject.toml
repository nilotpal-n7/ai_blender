[project]
name = "blender-worker"
version = "0.1.0"
description = "Headless Blender assembly engine for AI Blender — processes jobs from Redis, assembles 3D scenes via bpy, and manages OpenUSD layers via pxr."
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "usd-core>=24.11",
    "redis>=5.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "bpy-stubs",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
