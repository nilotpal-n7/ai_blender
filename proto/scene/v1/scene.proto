// Proto definitions for the AI Blender scene service.
// These define the gRPC contract between the Go orchestrator
// and internal services. Currently a placeholder for future
// gRPC migration from REST.

syntax = "proto3";

package scene.v1;

option go_package = "github.com/ai-blender/orchestrator/internal/proto/scene/v1;scenev1";

// ─── Service Definition ─────────────────────────────────────────────

service SceneService {
  // Health check for service discovery and load balancing.
  rpc GetHealth(HealthRequest) returns (HealthResponse);

  // Create a new scene session.
  rpc CreateScene(CreateSceneRequest) returns (CreateSceneResponse);

  // Submit a text prompt for AI processing within a scene.
  rpc SubmitPrompt(SubmitPromptRequest) returns (SubmitPromptResponse);

  // Apply a USD override layer from user viewport edits.
  rpc ApplyOverride(ApplyOverrideRequest) returns (ApplyOverrideResponse);
}

// ─── Health ─────────────────────────────────────────────────────────

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  string timestamp = 3;
}

// ─── Scene Management ───────────────────────────────────────────────

message CreateSceneRequest {
  string name = 1;
  string initial_prompt = 2;
}

message CreateSceneResponse {
  string scene_id = 1;
  string status = 2;
}

message SubmitPromptRequest {
  string scene_id = 1;
  string prompt = 2;
  // The current USD override layer as USDA text (may be empty).
  string override_layer_usda = 3;
}

message SubmitPromptResponse {
  string job_id = 1;
  string status = 2;
}

message ApplyOverrideRequest {
  string scene_id = 1;
  // USDA text representing the user's viewport edits.
  string override_layer_usda = 2;
}

message ApplyOverrideResponse {
  string status = 1;
  int32 layer_count = 2;
}
